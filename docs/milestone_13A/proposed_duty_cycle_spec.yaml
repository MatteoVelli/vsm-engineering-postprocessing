reference_quirks_to_not_encode_as_physics:
  - RMS formulas divide by 17417 although 17418 data samples are present.
  - Small distance jumps occur at some phase boundaries.
  - SOC is manually rounded/reset at several phase starts after charging.
  - Some loading boundary cells inherit inconsistent auxiliary/generator states.
  - Some AL formulas are misaligned near field 5 boundaries.
  - AX cumulative formulas contain inconsistent absolute start rows.
  - Some loading-start BR cells are forced to zero while BO is already near 80 kW.
  - PPT phase durations and intermediate SOC values are not numerically authoritative.
  - Fuel Energy Consumed = 80*12 is compatibility-only until the factor 12 is explained.

implementation_gate_for_13B:
