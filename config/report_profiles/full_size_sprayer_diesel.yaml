kpis:
- kpi_id: drive_cycle_minutes
  expression: (track_time_last - track_time_first) / 60.0
  dependencies:
  - track_time_last
  - track_time_first
  display_name: Drive Cycle Time
  unit: min
  required: true
  placement_group: diesel_executive
- kpi_id: distance_km
  expression: (track_distance_last - track_distance_first) / 1000.0
  dependencies:
  - track_distance_last
  - track_distance_first
  display_name: Distance
  unit: km
  required: true
  placement_group: diesel_executive
- kpi_id: fuel_consumed_kg
  expression: engine_fuel_consumption_last - engine_fuel_consumption_first
  dependencies:
  - engine_fuel_consumption_last
  - engine_fuel_consumption_first
  display_name: Total Fuel Consumption
  unit: kg
  required: true
  placement_group: diesel_executive
- kpi_id: engine_speed_average
  expression: time_average(engine_speed, track_time)
  dependencies:
  - engine_speed
  - track_time
  display_name: Average Engine Speed
  unit: rpm
  required: true
  placement_group: diesel_executive
  notes: Trapezoidal time-weighted average, not a sample-count mean.
- kpi_id: fuel_flow_average
  expression: time_average(fuel_flow, track_time)
  dependencies:
  - fuel_flow
  - track_time
  display_name: Average Fuel Flow
  unit: l/h
  required: false
  placement_group: diesel_executive
  notes: Trapezoidal time-weighted average of the source volumetric flow.
