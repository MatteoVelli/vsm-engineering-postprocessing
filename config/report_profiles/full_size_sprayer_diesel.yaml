  order: 10
  x: track_time
  x_label: Time [s]
  primary_y_label: Oil Temperature [°C]
  series:
  - semantic_name: engine_oil_temperature
    label: Oil Temperature
    required: false
  notes: Oil temperature plotted once; the reference coolant trace is identical. Both raw temperatures remain exported.
presentation:
  footer: VSM Engineering Post-Processing Tool
  slides:
  - slide_id: cover
    statistics: [distance_km, drive_cycle_minutes, fuel_consumed_kg, engine_power_max, engine_torque_max, chassis_speed_max]
  - slide_id: system_overview
    statistics: [drive_cycle_minutes, distance_km, road_gradient_min, road_gradient_max]
  - slide_id: executive_results
    statistics: [drive_cycle_minutes, distance_km, chassis_speed_max, fuel_consumed_kg, engine_power_max, engine_torque_max, engine_speed_max, fuel_flow_average]
  - slide_id: vehicle_operation
    statistics: [distance_km, drive_cycle_minutes, chassis_speed_max, road_gradient_min, road_gradient_max]
    plots: [diesel_speed_gradient]
  - slide_id: diesel_engine
    statistics: [engine_speed_max, engine_speed_average, engine_torque_max, engine_power_max, engine_power_min, engine_power_rms]
    plots: [diesel_engine_speed, diesel_engine_torque_power]
  - slide_id: diesel_fuel_energy
    statistics: [fuel_consumed_kg, fuel_flow_average, fuel_flow_max, fuel_volume_last, engine_mechanical_energy_last]
    plots: [diesel_cumulative_fuel, diesel_fuel_flow]
  - slide_id: diesel_driveline
    statistics: [driveshaft_torque_fl_max, driveshaft_torque_rr_max, tyre_fz_fl_max, tyre_fz_rr_max]
    plots: [diesel_driveshaft_torque, diesel_wheel_loads]
  - slide_id: diesel_controls
    statistics: [engine_load_max, engine_throttle_max]
    plots: [diesel_engine_load, diesel_engine_throttle]
  - slide_id: diesel_thermal
    statistics: [engine_oil_temperature_min, engine_oil_temperature_max]
    plots: [diesel_engine_oil_temperature]
  - slide_id: simulation_summary
    statistics: [distance_km, drive_cycle_minutes, fuel_consumed_kg, engine_power_max, engine_torque_max, engine_mechanical_energy_last]
