# Diesel is intentionally independent of the Electric/Hybrid profiles.
version: 1
profile:
  profile_id: full_size_sprayer_diesel
  name: Full Size Sprayer Diesel
  powertrain: diesel
  description: Verified Diesel analysis with native Excel and Astauto PowerPoint reporting.
channels:
  raw:
  - semantic_name: track_time
    source_name: Track_Time
    report_name: Time
    channel_type: VSM
    unit: s
    required: true
    for_plot: true
  - semantic_name: track_distance
    source_name: Track_Distance
    report_name: Distance
    channel_type: VSM
    unit: m
    required: true
  - semantic_name: chassis_speed
    source_name: Chassis_Speed
    report_name: Vehicle Speed
    channel_type: VSM
    unit: kph
    required: true
    for_plot: true
  - semantic_name: track_gradient
    source_name: Track_Gradient
    report_name: Road Gradient
    channel_type: VSM
    unit: '%'
    required: true
    for_plot: true
  - semantic_name: engine_speed
    source_name: Engine_Speed
    report_name: Engine Speed
    channel_type: VSM
    unit: rpm
    required: true
    for_plot: true
  - semantic_name: engine_torque
    source_name: Engine_Torque
    report_name: Engine Torque
    channel_type: VSM
    unit: Nm
    required: true
    notes: Signed shaft torque. Negative mechanical power is retained, including overrun.
    for_plot: true
  - semantic_name: engine_fuel_consumption
    source_name: Engine_FuelConsumption_absolut
    report_name: Cumulative Fuel Mass
    channel_type: VSM
    unit: kg
    required: true
    notes: Monotonic source counter; consumed mass is last minus first, including nonzero initial counters.
    for_plot: true
  - semantic_name: track_height
    source_name: Track_Height
    report_name: Road Height
    channel_type: VSM
    unit: m
    required: false
  - semantic_name: fuel_flow
    source_name: Engine_FuelConsumption_volumeflow
    report_name: Volumetric Fuel Flow
    channel_type: VSM
    unit: l/h
    required: false
    notes: Instantaneous source flow. Integrated directly without a density assumption.
    for_plot: true
  - semantic_name: fuel_specific
    source_name: Engine_FuelConsumption_specific
    report_name: Source Specific Fuel Consumption
    channel_type: VSM
    unit: g/kWh
    required: false
    notes: Source operating-point signal only; not a cycle BSFC KPI, especially during negative shaft power.
  - semantic_name: engine_load
    source_name: Engine_Load
    report_name: Engine Load Torque
    channel_type: VSM
    unit: Nm
    required: false
    notes: Source unit is Nm, not percent. Distinct from Engine_Torque.
    for_plot: true
  - semantic_name: engine_throttle
    source_name: Engine_Throttle
    report_name: Engine Throttle
    channel_type: VSM
    unit: '%'
    required: false
    for_plot: true
  - semantic_name: engine_oil_temperature
    source_name: Engine_Oil_Temperature
    report_name: Engine Oil Temperature
    channel_type: VSM
    unit: °C
    required: false
    notes: Raw source temperature only; reference oil and water traces are identical.
    for_plot: true
  - semantic_name: engine_water_temperature
    source_name: Engine_Water_Temperature
    report_name: Engine Water Temperature
    channel_type: VSM
    unit: °C
    required: false
    notes: Raw source temperature only; reference oil and water traces are identical.
  - semantic_name: chassis_acceleration_longitudinal
    source_name: Chassis_Acceleration_Longitudinal
    report_name: Longitudinal Acceleration
    channel_type: VSM
    unit: m/s^2
    required: false
  - semantic_name: chassis_acceleration_lateral
    source_name: Chassis_Acceleration_Lateral
    report_name: Lateral Acceleration
    channel_type: VSM
    unit: m/s^2
    required: false
  - semantic_name: chassis_acceleration_vertical
    source_name: Chassis_Acceleration_Vertical
    report_name: Vertical Acceleration
    channel_type: VSM
    unit: m/s^2
    required: false
  - semantic_name: tyre_fz_fl
    source_name: Tyre_Fz_FL
    report_name: Tyre Vertical Load FL
    channel_type: VSM
    unit: N
    required: false
    for_plot: true
  - semantic_name: driveshaft_torque_fl
    source_name: DriveShaft_Torque_FL
    report_name: Driveshaft Torque FL
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
  - semantic_name: tyre_fz_fr
    source_name: Tyre_Fz_FR
    report_name: Tyre Vertical Load FR
    channel_type: VSM
    unit: N
    required: false
    for_plot: true
  - semantic_name: driveshaft_torque_fr
    source_name: DriveShaft_Torque_FR
    report_name: Driveshaft Torque FR
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
  - semantic_name: tyre_fz_rl
    source_name: Tyre_Fz_RL
    report_name: Tyre Vertical Load RL
    channel_type: VSM
    unit: N
    required: false
    for_plot: true
  - semantic_name: driveshaft_torque_rl
    source_name: DriveShaft_Torque_RL
    report_name: Driveshaft Torque RL
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
  - semantic_name: tyre_fz_rr
    source_name: Tyre_Fz_RR
    report_name: Tyre Vertical Load RR
    channel_type: VSM
    unit: N
    required: false
    for_plot: true
  - semantic_name: driveshaft_torque_rr
    source_name: DriveShaft_Torque_RR
    report_name: Driveshaft Torque RR
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
  - semantic_name: track_reference_position_x
    source_name: Track_ReferencePosition_X
    report_name: Road ReferencePosition X
    channel_type: VSM
    unit: m
    required: false
  - semantic_name: track_reference_position_y
    source_name: Track_ReferencePosition_Y
    report_name: Road ReferencePosition Y
    channel_type: VSM
    unit: m
    required: false
  - semantic_name: accelerator_pedal
    source_name: Driver_AcceleratorPedal
    report_name: Accelerator Pedal
    channel_type: VSM
    unit: '%'
    required: false
    for_plot: true
  - semantic_name: brake_pedal
    source_name: Driver_BrakePedal
    report_name: Brake Pedal
    channel_type: VSM
    unit: '%'
    required: false
    for_plot: true
  - semantic_name: brake_pressure_front
    source_name: Brake_Pressure_Front
    report_name: Brake Pressure FT
    channel_type: VSM
    unit: bar
    required: false
  - semantic_name: brake_pressure_rear
    source_name: Brake_Pressure_Rear
    report_name: Brake Pressure RR
    channel_type: VSM
    unit: bar
    required: false
  - semantic_name: steering_wheel_angle
    source_name: Driver_HandWheel_Angle
    report_name: Steering Wheel Angle
    channel_type: VSM
    unit: deg
    required: false
    for_plot: true
  - semantic_name: agrochemical_discharge_force
    source_name: HitchRear_Force_Z_VehicleCoordinates
    report_name: Agrochemical Discharge
    channel_type: VSM
    unit: N
    required: false
    aliases:
    - Agrochemical Discharge
    for_plot: true
    notes: Same proven force source as Electric/Hybrid; the Diesel template uses the report label as its source name.
  - semantic_name: tyre_rolling_resistance_force_fl
    source_name: Tyre_RollingResistanceForce_FL
    report_name: Tyre Rolling Resistance Force FL
    channel_type: VSM
    unit: N
    required: false
  - semantic_name: tyre_rolling_resistance_power_fl
    source_name: Tyre_RollingResistancePower_FL
    report_name: Tyre Rolling Resistance Power FL
    channel_type: VSM
    unit: kW
    required: false
    for_plot: true
  - semantic_name: wheel_speed_fl
    source_name: Wheel_RotationalSpeed_FL
    report_name: Wheel Speed FL
    channel_type: VSM
    unit: rpm
    required: false
    for_plot: true
  - semantic_name: tyre_rolling_resistance_force_fr
    source_name: Tyre_RollingResistanceForce_FR
    report_name: Tyre Rolling Resistance Force FR
    channel_type: VSM
    unit: N
    required: false
  - semantic_name: tyre_rolling_resistance_power_fr
    source_name: Tyre_RollingResistancePower_FR
    report_name: Tyre Rolling Resistance Power FR
    channel_type: VSM
    unit: kW
    required: false
    for_plot: true
  - semantic_name: wheel_speed_fr
    source_name: Wheel_RotationalSpeed_FR
    report_name: Wheel Speed FR
    channel_type: VSM
    unit: rpm
    required: false
    for_plot: true
  - semantic_name: tyre_rolling_resistance_force_rl
    source_name: Tyre_RollingResistanceForce_RL
    report_name: Tyre Rolling Resistance Force RL
    channel_type: VSM
    unit: N
    required: false
  - semantic_name: tyre_rolling_resistance_power_rl
    source_name: Tyre_RollingResistancePower_RL
    report_name: Tyre Rolling Resistance Power RL
    channel_type: VSM
    unit: kW
    required: false
    for_plot: true
  - semantic_name: wheel_speed_rl
    source_name: Wheel_RotationalSpeed_RL
    report_name: Wheel Speed RL
    channel_type: VSM
    unit: rpm
    required: false
    for_plot: true
  - semantic_name: tyre_rolling_resistance_force_rr
    source_name: Tyre_RollingResistanceForce_RR
    report_name: Tyre Rolling Resistance Force RR
    channel_type: VSM
    unit: N
    required: false
  - semantic_name: tyre_rolling_resistance_power_rr
    source_name: Tyre_RollingResistancePower_RR
    report_name: Tyre Rolling Resistance Power RR
    channel_type: VSM
    unit: kW
    required: false
    for_plot: true
  - semantic_name: wheel_speed_rr
    source_name: Wheel_RotationalSpeed_RR
    report_name: Wheel Speed RR
    channel_type: VSM
    unit: rpm
    required: false
    for_plot: true
  - semantic_name: auxiliary_low_voltage_power
    source_name: ElectricSystem_Auxiliary_LowVoltagePowerConsumption
    report_name: Auxiliary Low Voltage Power Consumption
    channel_type: VSM
    unit: kW
    required: false
    notes: Low-voltage auxiliaries are a Diesel template channel; this does not select battery or EDU channels.
  - semantic_name: engine_auxiliary_torque_1
    source_name: Engine_AuxiliaryTorque_1
    report_name: Generator Torque_1
    channel_type: VSM
    unit: Nm
    required: false
    notes: Torque source for Diesel mechanical auxiliaries. Template Generator Torque_2 incorrectly repeats source
      _1; use distinct _2.
  - semantic_name: engine_auxiliary_torque_2
    source_name: Engine_AuxiliaryTorque_2
    report_name: Generator Torque_2
    channel_type: VSM
    unit: Nm
    required: false
    notes: Torque source for Diesel mechanical auxiliaries. Template Generator Torque_2 incorrectly repeats source
      _1; use distinct _2.
  math:
  - semantic_name: engine_power
    source_name: Engine Power
    report_name: Engine Power
    unit: kW
    dependencies:
    - engine_torque
    - engine_speed
    expression: engine_torque * engine_speed * 2.0 * 3.141592653589793 / 60000.0
    notes: Exact SI conversion using the double-precision value of pi; deliberately independent of the legacy Hybrid
      divisor.
    for_plot: true
  - semantic_name: engine_mechanical_energy
    source_name: Engine Mechanical Energy
    report_name: Net Engine Mechanical Energy
    unit: kWh
    dependencies:
    - engine_power
    - track_time
    expression: cumulative_trapezoid(engine_power, track_time) / 3600.0
    notes: Signed trapezoidal integral over elapsed time; starts at zero. Negative power reduces net energy.
  - semantic_name: fuel_volume
    source_name: Fuel Volume Consumed
    report_name: Integrated Fuel Volume
    unit: l
    required: false
    dependencies:
    - fuel_flow
    - track_time
    expression: cumulative_trapezoid(fuel_flow, track_time) / 3600.0
    notes: Estimated from sampled l/h flow over elapsed seconds, without mass/density conversion.
  - semantic_name: time_minutes
    source_name: Time
    report_name: Time (min)
    unit: min
    required: false
    dependencies:
    - track_time
    expression: track_time / 60.0
    for_plot: true
  - semantic_name: distance_km
    source_name: Distance
    report_name: Distance (Km)
    unit: km
    required: false
    dependencies:
    - track_distance
    expression: track_distance / 1000.0
    for_plot: true
  - semantic_name: engine_energy_delivered
    source_name: Engine Energy Delivered [kWh]
    report_name: Engine Energy Delivered [kWh]
    unit: kWh
    required: false
    dependencies:
    - engine_power
    - track_time
    expression: sample_energy_kwh(engine_power, track_time)
    notes: Template per-interval energy, distinct from preserved baseline cumulative trapezoidal net energy. Uses
      actual intervals; first interval follows existing sample_energy_kwh convention.
  - semantic_name: agrochemical_discharge
    source_name: Agrochemical Discharge
    report_name: Agrochemical Discharge
    unit: kg
    required: false
    dependencies:
    - agrochemical_discharge_force
    expression: -agrochemical_discharge_force / 9.80665
    for_plot: true
    notes: Diesel template gravity conversion; preserve the force sign and do not claim discharged mass from a static
      hitch load.
  - semantic_name: total_rolling_resistance_power
    source_name: Total Rolling Resistance Power
    report_name: Total Rolling Resistance Power
    unit: kW
    required: false
    dependencies:
    - tyre_rolling_resistance_power_fl
    - tyre_rolling_resistance_power_fr
    - tyre_rolling_resistance_power_rl
    - tyre_rolling_resistance_power_rr
    expression: tyre_rolling_resistance_power_fl + tyre_rolling_resistance_power_fr + tyre_rolling_resistance_power_rl
      + tyre_rolling_resistance_power_rr
  - semantic_name: tyre_rolling_resistance_energy_kwh
    source_name: Tyre Rolling Resistance Energy [kWh]
    report_name: Tyre Rolling Resistance Energy [kWh]
    unit: kWh
    required: false
    dependencies:
    - total_rolling_resistance_power
    - track_time
    expression: sample_energy_kwh(total_rolling_resistance_power, track_time)
    notes: Template per-interval energy; actual sample intervals replace the hardcoded one-second interval.
  - semantic_name: tyre_rolling_resistance_energy_wh
    source_name: Tyre Rolling Resistance Energy [Wh]
    report_name: Tyre Rolling Resistance Energy [Wh]
    unit: Wh
    required: false
    dependencies:
    - tyre_rolling_resistance_energy_kwh
    expression: tyre_rolling_resistance_energy_kwh * 1000.0
    for_plot: true
  - semantic_name: tyre_rolling_resistance_energy_accumulated
    source_name: Tyre Rolling Resistance Energy Accumulated
    report_name: Tyre Rolling Resistance Energy Accumulated
    unit: kWh
    required: false
    dependencies:
    - tyre_rolling_resistance_energy_kwh
    expression: cumulative_sum(tyre_rolling_resistance_energy_kwh)
    for_plot: true
    notes: Accumulates every interval once; corrects the template initial forward reference and omitted first interval.
  - semantic_name: wheel_total_torque
    source_name: Wheel Total Torque
    report_name: Wheel Total Torque
    unit: Nm
    required: false
    dependencies:
    - driveshaft_torque_fl
    - driveshaft_torque_fr
    - driveshaft_torque_rl
    - driveshaft_torque_rr
    expression: driveshaft_torque_fl + driveshaft_torque_fr + driveshaft_torque_rl + driveshaft_torque_rr
    for_plot: true
  - semantic_name: wheel_power_fl
    source_name: Wheel Power FL
    report_name: Wheel Power FL
    unit: kW
    required: false
    dependencies:
    - wheel_speed_fl
    - driveshaft_torque_fl
    expression: wheel_speed_fl * driveshaft_torque_fl * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
    notes: Exact SI conversion consistent with existing Diesel engine power; signed corner shaft power retained.
  - semantic_name: wheel_power_fr
    source_name: Wheel Power FR
    report_name: Wheel Power FR
    unit: kW
    required: false
    dependencies:
    - wheel_speed_fr
    - driveshaft_torque_fr
    expression: wheel_speed_fr * driveshaft_torque_fr * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
    notes: Exact SI conversion consistent with existing Diesel engine power; signed corner shaft power retained.
  - semantic_name: wheel_power_rl
    source_name: Wheel Power RL
    report_name: Wheel Power RL
    unit: kW
    required: false
    dependencies:
    - wheel_speed_rl
    - driveshaft_torque_rl
    expression: wheel_speed_rl * driveshaft_torque_rl * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
    notes: Exact SI conversion consistent with existing Diesel engine power; signed corner shaft power retained.
  - semantic_name: wheel_power_rr
    source_name: Wheel Power RR
    report_name: Wheel Power RR
    unit: kW
    required: false
    dependencies:
    - wheel_speed_rr
    - driveshaft_torque_rr
    expression: wheel_speed_rr * driveshaft_torque_rr * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
    notes: Exact SI conversion consistent with existing Diesel engine power; signed corner shaft power retained.
  - semantic_name: wheel_power_total
    source_name: Wheel Power Total
    report_name: Wheel Power Total
    unit: kW
    required: false
    dependencies:
    - wheel_power_fl
    - wheel_power_fr
    - wheel_power_rl
    - wheel_power_rr
    expression: wheel_power_fl + wheel_power_fr + wheel_power_rl + wheel_power_rr
    for_plot: true
  - semantic_name: auxiliary_power_1
    source_name: Auxiliary Power_1
    report_name: Auxiliary Power_1
    unit: kW
    required: false
    dependencies:
    - engine_speed
    - engine_auxiliary_torque_1
    expression: engine_speed * engine_auxiliary_torque_1 * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
  - semantic_name: auxiliary_power_2
    source_name: Auxiliary Power_2
    report_name: Auxiliary Power_2
    unit: kW
    required: false
    dependencies:
    - engine_speed
    - engine_auxiliary_torque_2
    expression: engine_speed * engine_auxiliary_torque_2 * 2.0 * 3.141592653589793 / 60000.0
    for_plot: true
  - semantic_name: total_auxiliary_power
    source_name: Total Auxiliary Power
    report_name: Total Auxiliary Power
    unit: kW
    required: false
    dependencies:
    - auxiliary_power_1
    - auxiliary_power_2
    expression: auxiliary_power_1 + auxiliary_power_2
    for_plot: true
    notes: Matches template mechanical auxiliary total; low-voltage power is exported separately and not added to
      this total.
