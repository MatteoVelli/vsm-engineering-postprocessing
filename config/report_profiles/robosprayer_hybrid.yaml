version: 1
profile:
  profile_id: robosprayer_hybrid
  name: RoboSprayer Hybrid
  description: Hybrid extension of the RoboSprayer Electric/common base using the nine additional Sergio Hybrid workbook entries.
  powertrain: hybrid
  extends: robosprayer_electric.yaml
channels:
  raw:
  - semantic_name: engine_fuel_consumption
    source_name: 'Engine Fuel Consumption '
    report_name: 'Engine Fuel Consumption '
    unit: kg
    required: true
    for_plot: true
    channel_type: VSM
    aliases:
    - Engine_FuelConsumption_absolut
    notes: Alias records the likely raw CSV channel; Sergio workbook source name differs and does not fully prove the mapping.
  - semantic_name: engine_fuelconsumption_specific
    source_name: Engine_FuelConsumption_specific
    report_name: Engine_FuelConsumption_specific
    unit: g/kWh
    required: true
    for_plot: false
    channel_type: VSM
  - semantic_name: fuel_flow
    source_name: Fuel Flow
    report_name: Fuel Flow
    unit: l/h
    required: true
    for_plot: false
    channel_type: VSM
    aliases:
    - Engine_FuelConsumption_volumeflow
    notes: Alias records the likely l/h fuel-flow channel; Sergio workbook source name differs and does not fully prove the
      mapping.
  - semantic_name: engine_speed
    source_name: Engine Speed
    report_name: Engine Speed
    unit: rpm
    required: true
    for_plot: true
    channel_type: VSM
  - semantic_name: engine_torque
    source_name: Engine Torque
    report_name: Engine Torque
    unit: Nm
    required: true
    for_plot: true
    channel_type: VSM
  - semantic_name: generator_torque_1
    source_name: Engine_AuxiliaryTorque_1
    report_name: 'ICE Generator Torque '
    unit: Nm
    required: true
    for_plot: true
    channel_type: AVL
    notes: Sergio corrected the Hybrid source mapping; report quantity Generator Torque_1 resolves from raw Engine_AuxiliaryTorque_1.
  math:
  - semantic_name: engine_power_required
    source_name: Engine Power Required
    report_name: Engine Power Required
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - engine_speed
    - engine_torque
    formula: =BX5*BY5/9548.8
    expression: engine_speed * engine_torque / rpm_nm_to_kw_divisor
  - semantic_name: engine_energy_delivered_kwh
    source_name: Engine Energy Delivered [kWh]
    report_name: Engine Energy Delivered [kWh]
    unit: kWh
    required: true
    for_plot: true
    dependencies:
    - engine_power_required
    - track_time
    formula: =BZ5/3600
    expression: sample_energy_kwh(engine_power_required, track_time)
  - semantic_name: generator_power_1
    source_name: Generator Power_1
    report_name: ICE Generator Power
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - engine_speed
    - generator_torque_1
    formula: =BX5*HP5/9548.8
    expression: engine_speed * generator_torque_1 / rpm_nm_to_kw_divisor
statistics:
  - statistic_id: engine_fuel_consumption_last
    target: engine_fuel_consumption
    operation: last
    display_name: Engine Fuel Consumption
    unit: kg
    placement_group: hybrid_summary
  - statistic_id: engine_fuelconsumption_specific_max
    target: engine_fuelconsumption_specific
    operation: max
    display_name: Engine_FuelConsumption_specific
    unit: g/kWh
    placement_group: hybrid_summary
  - statistic_id: fuel_flow_max
    target: fuel_flow
    operation: max
    display_name: Fuel Flow
    unit: l/h
    placement_group: hybrid_summary
    notes: Uses explicit alias Engine_FuelConsumption_volumeflow when validating against the supplied Electric CSV.
  - statistic_id: engine_speed_max
    target: engine_speed
    operation: max
    display_name: Max Engine Speed
    unit: rpm
    placement_group: hybrid_summary
  - statistic_id: engine_torque_max
    target: engine_torque
    operation: max
    display_name: Max Engine Torque Required
    unit: Nm
    placement_group: hybrid_summary
  - statistic_id: engine_power_required_max
    target: engine_power_required
    operation: max
    display_name: Max Engine Power Required
    unit: kW
    placement_group: hybrid_summary
  - statistic_id: engine_energy_delivered_sum
    target: engine_energy_delivered_kwh
    operation: sum
    display_name: Engine Energy Delivered
    unit: kWh
    placement_group: hybrid_summary
  - statistic_id: generator_torque_1_max
    target: generator_torque_1
    operation: max
    display_name: ICE Generator Torque
    unit: Nm
    placement_group: hybrid_summary
  - statistic_id: generator_power_1_max
    target: generator_power_1
    operation: max
    display_name: ICE Generator Power
    unit: kW
    placement_group: hybrid_summary
plots:
  - plot_id: fuel_consumption
    order: 13
    reference_chart_number: 1
    title: Fuel Consumption
    x: time_minutes
    x_label: Time [min]
    primary_y_label: Fuel Consumption [kg]
    secondary_y_label: Fuel Flow [l/h]
    output_filename: 13_fuel_consumption.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 1 contains fuel consumption only; neighbouring fuel-flow channel completes the intended fuel plot.
    series:
      - semantic_name: engine_fuel_consumption
        axis: primary
        label: Engine Fuel Consumption
      - semantic_name: fuel_flow
        axis: secondary
        label: Fuel Flow
  - plot_id: generator_power
    order: 14
    reference_chart_number: 5
    title: Generator Power
    x: time_minutes
    x_label: Time [min]
    primary_y_label: Generator Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 14_generator_power.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 5 is stale and points to fuel consumption; Sergio's corrected mapping makes Generator Power_1 depend on Engine_AuxiliaryTorque_1.
    series:
      - semantic_name: generator_power_1
        axis: primary
        label: ICE Generator Power
      - semantic_name: engine_fuel_consumption
        axis: secondary
        label: Engine Fuel Consumption
  - plot_id: battery_energy_and_fuel_vs_time
    order: 15
    reference_chart_number: 14
    title: Battery Energy & Fuel Consumption Vs Time
    x: time_minutes
    x_label: Time [min]
    primary_y_label: Battery Energy [kWh]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 15_battery_energy_and_fuel_vs_time.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 14 contains Battery Energy only; title and fuel-consumption channel identify the paired secondary series.
    series:
      - semantic_name: electricsystem_battery_energy
        axis: primary
        label: Battery Energy
      - semantic_name: engine_fuel_consumption
        axis: secondary
        label: Engine Fuel Consumption
  - plot_id: engine_power_and_fuel_vs_distance
    order: 16
    reference_chart_number: 15
    title: Engine Power Required & Fuel Consumption Vs Distance
    x: distance_km
    x_label: Distance [km]
    primary_y_label: Engine Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 16_engine_power_and_fuel_vs_distance.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 15 contains fuel consumption only; title and MATH channel identify Engine Power Required.
    series:
      - semantic_name: engine_power_required
        axis: primary
        label: Engine Power Required
      - semantic_name: engine_fuel_consumption
        axis: secondary
        label: Engine Fuel Consumption
  - plot_id: battery_energy_and_fuel_vs_distance
    order: 17
    reference_chart_number: 16
    title: Battery Energy & Fuel Consumption Vs Distance
    x: distance_km
    x_label: Distance [km]
    primary_y_label: Battery Energy [kWh]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 17_battery_energy_and_fuel_vs_distance.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 16 contains Battery Energy only; title and fuel-consumption channel identify the paired secondary series.
    series:
      - semantic_name: electricsystem_battery_energy
        axis: primary
        label: Battery Energy
      - semantic_name: engine_fuel_consumption
        axis: secondary
        label: Engine Fuel Consumption
  - plot_id: engine_power_and_fuel_vs_time
    order: 18
    reference_chart_number: 17
    title: Engine Power Required & Fuel Consumption Vs Time
    x: time_minutes
    x_label: Time [min]
    primary_y_label: Engine Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 18_engine_power_and_fuel_vs_time.png
    status: RECONSTRUCTED
    evidence: Corrected Hybrid chart 17 contains fuel consumption only; title and MATH channel identify Engine Power Required.
    series:
      - semantic_name: engine_power_required
        axis: primary
        label: Engine Power Required
      - semantic_name: engine_fuel_consumption
        axis: secondary
        label: Engine Fuel Consumption
presentation:
  footer: VSM Engineering Post-Processing Tool
  slides:
    - slide_id: cover
      statistics:
        - distance_km_last
        - time_minutes_last
        - battery_soc_last
        - engine_fuel_consumption_last
        - generator_power_1_max
        - engine_power_required_max
    - slide_id: system_overview
      statistics:
        - time_minutes_last
        - distance_km_last
        - chassis_speed_max
        - generator_power_1_max
    - slide_id: executive_results
      statistics:
        - time_minutes_last
        - distance_km_last
        - chassis_speed_max
        - battery_soc_first
        - battery_soc_last
        - battery_capacity_used
        - engine_fuel_consumption_last
        - generator_power_1_max
    - slide_id: vehicle_operation
      statistics:
        - distance_km_last
        - time_minutes_last
        - chassis_speed_max
        - battery_soc_last
      plots:
        - speed_vs_distance
    - slide_id: battery_system
      statistics:
        - battery_soc_first
        - battery_soc_last
        - max_battery_discharge_power
        - battery_power_rms
        - battery_heatflow_rms
        - battery_capacity_used
      plots:
        - battery_soc
        - battery_energy_time_based
    - slide_id: battery_power_recovery
      statistics:
        - battery_power_rms
        - energy_released_last
        - energy_recuperated_last
        - auxiliary_energy_accumulated_last
        - max_battery_discharge_power
      plots:
        - battery_power_charge_discharge
        - energy_released
    - slide_id: range_extender_generator
      statistics:
        - generator_power_1_max
        - engine_power_required_max
        - engine_speed_max
        - engine_torque_max
        - engine_fuel_consumption_last
        - engine_energy_delivered_sum
      plots:
        - generator_power
        - engine_power_and_fuel_vs_time
    - slide_id: agrochemical_battery
      statistics:
        - agrochemical_discharge_max
        - battery_soc_last
        - engine_fuel_consumption_last
        - time_minutes_last
      plots:
        - agrochemical_discharge_vs_distance
        - battery_energy_and_fuel_vs_time
    - slide_id: traction_auxiliaries
      statistics:
        - total_edu_mech_power_max
        - wheel_power_total_max
        - edu_speed_rl_max
        - edu_torque_rl_max
        - tyre_rr_energy_accumulated_last
        - auxiliary_energy_accumulated_last
      plots:
        - power_at_wheels_and_edu
        - tyres_energy_consumption
    - slide_id: simulation_summary
      statistics:
        - distance_km_last
        - time_minutes_last
        - battery_soc_last
        - engine_fuel_consumption_last
        - generator_power_1_max
        - engine_energy_delivered_sum
