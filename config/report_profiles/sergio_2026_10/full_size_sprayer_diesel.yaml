version: 1
profile:
  profile_id: full_size_sprayer_diesel
  name: Full Size Sprayer Diesel
  powertrain: diesel
  extends: ../full_size_sprayer_diesel.yaml
  description: 'Sergio 15 October 2026: measured sources, signed power and observed-interval
    energy.'
  excel_template: reference_files/Diesel Template_03.xlsx
overrides:
  raw:
    engine_water_temperature:
      for_plot: true
      notes: Legacy source name is supported when actually supplied. The _03 template
        does not specify coolant source; select the measured temperature channel in
        the UI or override this mapping.
  math:
    engine_energy_delivered:
      expression: interval_energy_kwh(engine_power, track_time)
    tyre_rolling_resistance_energy_kwh:
      expression: interval_energy_kwh(total_rolling_resistance_power, track_time)
  plots:
    diesel_driveshaft_torque:
      title: Wheel Torque
      primary_y_label: Torque [Nm]
      series:
      - semantic_name: driveshaft_torque_fl
        label: Wheel Torque FL
        required: false
      - semantic_name: driveshaft_torque_fr
        label: Wheel Torque FR
        required: false
      - semantic_name: driveshaft_torque_rl
        label: Wheel Torque RL
        required: false
      - semantic_name: driveshaft_torque_rr
        label: Wheel Torque RR
        required: false
      - semantic_name: wheel_total_torque
        label: Wheel Total Torque
        required: false
plots:
- plot_id: diesel_engine_water_temperature
  title: Engine Water Temperature
  x: track_time
  x_label: Time [s]
  primary_y_label: Water Temperature [°C]
  order: 20
  series:
  - semantic_name: engine_water_temperature
    label: Engine Water Temperature
    required: false
- plot_id: wheel_power
  title: Wheel Power
  x: distance_km
  x_label: Distance [km]
  primary_y_label: Power [kW]
  order: 21
  series:
  - semantic_name: wheel_power_fl
    label: Wheel Power FL
    required: false
  - semantic_name: wheel_power_fr
    label: Wheel Power FR
    required: false
  - semantic_name: wheel_power_rl
    label: Wheel Power RL
    required: false
  - semantic_name: wheel_power_rr
    label: Wheel Power RR
    required: false
  - semantic_name: wheel_power_total
    label: Wheel Power Total
    required: false
statistics:
- statistic_id: engine_water_temperature_rms
  target: engine_water_temperature
  operation: rms
  display_name: Engine Water Temperature RMS
  required: false
  placement_group: thermal
- statistic_id: engine_water_temperature_last
  target: engine_water_temperature
  operation: last
  display_name: Engine Water Temperature LAST
  required: false
  placement_group: thermal
presentation:
  footer: VSM Engineering Post-Processing Tool
  slides:
  - slide_id: cover
    statistics:
    - distance_km
    - drive_cycle_minutes
    - fuel_consumed_kg
    - engine_power_max
    - engine_torque_max
    - chassis_speed_max
  - slide_id: system_overview
    statistics:
    - drive_cycle_minutes
    - distance_km
    - road_gradient_min
    - road_gradient_max
  - slide_id: executive_results
    statistics:
    - drive_cycle_minutes
    - distance_km
    - chassis_speed_max
    - fuel_consumed_kg
    - engine_power_max
    - engine_torque_max
    - engine_speed_max
    - fuel_flow_average
  - slide_id: vehicle_operation
    statistics:
    - distance_km
    - drive_cycle_minutes
    - chassis_speed_max
    - road_gradient_min
    - road_gradient_max
    plots:
    - diesel_speed_gradient
  - slide_id: diesel_engine
    statistics:
    - engine_speed_max
    - engine_speed_average
    - engine_torque_max
    - engine_power_max
    - engine_power_min
    - engine_power_rms
    plots:
    - diesel_engine_speed
    - diesel_engine_torque_power
  - slide_id: diesel_fuel_energy
    statistics:
    - fuel_consumed_kg
    - fuel_flow_average
    - fuel_flow_max
    - fuel_volume_last
    - engine_mechanical_energy_last
    plots:
    - diesel_cumulative_fuel
    - diesel_fuel_flow
  - slide_id: diesel_driveline
    statistics:
    - driveshaft_torque_fl_max
    - driveshaft_torque_rr_max
    - tyre_fz_fl_max
    - tyre_fz_rr_max
    plots:
    - diesel_driveshaft_torque
    - diesel_wheel_loads
  - slide_id: diesel_controls
    statistics:
    - engine_throttle_max
    plots:
    - diesel_engine_throttle
  - slide_id: diesel_thermal
    statistics:
    - engine_oil_temperature_min
    - engine_oil_temperature_max
    - engine_water_temperature_min
    - engine_water_temperature_max
    plots:
    - diesel_engine_oil_temperature
    - diesel_engine_water_temperature
  - slide_id: simulation_summary
    statistics:
    - distance_km
    - drive_cycle_minutes
    - fuel_consumed_kg
    - engine_power_max
    - engine_torque_max
    - engine_mechanical_energy_last
