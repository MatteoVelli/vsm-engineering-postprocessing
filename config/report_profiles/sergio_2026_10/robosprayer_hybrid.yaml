version: 1
profile:
  profile_id: robosprayer_hybrid
  name: Hybrid
  powertrain: hybrid
  extends: ../robosprayer_hybrid.yaml
  description: 'Sergio 15 October 2026: measured sources, signed power and observed-interval
    energy.'
  excel_template: reference_files/Robo_Sprayer_Electrification_Tamplate_Hybrid_08.xlsx
overrides:
  additional_presentation_slides:
  - slide_id: soil_bulldozing
    statistics:
    - soil_bulldozing_max_power
    - soil_bulldozing_mean_power
    - soil_bulldozing_rms_power
    - soil_bulldozing_total_energy
    - soil_bulldozing_energy_per_km
    - soil_bulldozing_distance
    mode: additional_plot_pair
    title: Tyre-Soil Bulldozing
    subtitle: Total resistance power [kW] and accumulated energy [kWh] versus time [s]
    plots:
    - total_bulldozing_resistance_power
    - tyre_bulldozing_resistance_energy_accumulated
  - slide_id: soil_compaction
    statistics:
    - soil_compaction_max_power
    - soil_compaction_mean_power
    - soil_compaction_rms_power
    - soil_compaction_total_energy
    - soil_compaction_energy_per_km
    - soil_compaction_distance
    mode: additional_plot_pair
    title: Tyre-Soil Compaction
    subtitle: Total resistance power [kW] and accumulated energy [kWh] versus time [s]
    plots:
    - total_compaction_resistance_power
    - tyre_compaction_resistance_energy_accumulated
  - slide_id: torque_maps
    mode: additional_plot_pair
    title: Torque–Speed Operating Maps
    subtitle: VSM simulation operating points showing the relationship between rotational speed and torque.
    statistics: []
    plots:
    - torque_map_powertrain
    - torque_map_wheels
  plots:
    road_profile:
      order: 22
    wheel_steering_angles:
      order: 23
  raw:
    driveshaft_torque_fl:
      source_name: KERS_MotGenUnit_GearboxOutputTorque_1
      aliases: []
      required: false
      notes: Measured gearbox-output torque at this wheel; no driveshaft fallback.
        Missing source disables dependent wheel analyses.
    driveshaft_torque_fr:
      source_name: KERS_MotGenUnit_GearboxOutputTorque_2
      aliases: []
      required: false
      notes: Measured gearbox-output torque at this wheel; no driveshaft fallback.
        Missing source disables dependent wheel analyses.
    driveshaft_torque_rl:
      source_name: KERS_MotGenUnit_GearboxOutputTorque_3
      aliases: []
      required: false
      notes: Measured gearbox-output torque at this wheel; no driveshaft fallback.
        Missing source disables dependent wheel analyses.
    driveshaft_torque_rr:
      source_name: KERS_MotGenUnit_GearboxOutputTorque_4
      aliases: []
      required: false
      notes: Measured gearbox-output torque at this wheel; no driveshaft fallback.
        Missing source disables dependent wheel analyses.
    tyre_bulldozingresistancepower_fl:
      required: false
    tyre_bulldozingresistancepower_fr:
      required: false
    tyre_bulldozingresistancepower_rl:
      required: false
    tyre_bulldozingresistancepower_rr:
      required: false
    tyre_compactionresistancepower_fl:
      required: false
    tyre_compactionresistancepower_fr:
      required: false
    tyre_compactionresistancepower_rl:
      required: false
    tyre_compactionresistancepower_rr:
      required: false
  math:
    auxiliary_high_voltage_power_consumption: null
    tyre_rolling_resistance_energy_kwh:
      expression: interval_energy_kwh(total_rolling_resistance_power, track_time)
      notes: Signed trapezoidal energy over observed time intervals; initial interval
        energy is zero.
    wheel_total_torque:
      required: false
    wheel_power_fl:
      required: false
      expression: wheel_rotationalspeed_fl * driveshaft_torque_fl * 2.0 * 3.141592653589793
        / 60000.0
    wheel_power_fr:
      required: false
      expression: wheel_rotationalspeed_fr * driveshaft_torque_fr * 2.0 * 3.141592653589793
        / 60000.0
    wheel_power_rl:
      required: false
      expression: wheel_rotationalspeed_rl * driveshaft_torque_rl * 2.0 * 3.141592653589793
        / 60000.0
    wheel_power_rr:
      required: false
      expression: wheel_rotationalspeed_rr * driveshaft_torque_rr * 2.0 * 3.141592653589793
        / 60000.0
    wheel_power_total:
      required: false
    total_auxiliary_power:
      required: false
    auxiliary_energy_consumption:
      expression: interval_energy_kwh(total_auxiliary_power, track_time)
      notes: Signed trapezoidal energy over observed time intervals; initial interval
        energy is zero.
      required: false
    auxiliary_energy_consumption_accumulated:
      required: false
    tyre_bulldozing_resistance_energy_kwh:
      expression: interval_energy_kwh(total_bulldozing_resistance_power, track_time)
      notes: Signed trapezoidal energy over observed time intervals; initial interval
        energy is zero.
      required: false
    tyre_compaction_resistance_energy_kwh:
      expression: interval_energy_kwh(total_compaction_resistance_power, track_time)
      notes: Signed trapezoidal energy over observed time intervals; initial interval
        energy is zero.
      required: false
    engine_energy_delivered_kwh:
      expression: interval_energy_kwh(engine_power_required, track_time)
      notes: Signed trapezoidal energy over observed time intervals; initial interval
        energy is zero.
    edu_mech_power_fl:
      expression: electricsystem_em1_speed * electricsystem_em1_torque * 2.0 * 3.141592653589793
        / 60000.0
    edu_mech_power_fr:
      expression: electricsystem_em2_speed * electricsystem_em2_torque * 2.0 * 3.141592653589793
        / 60000.0
    edu_mech_power_rl:
      expression: electricsystem_em3_speed * electricsystem_em3_torque * 2.0 * 3.141592653589793
        / 60000.0
    edu_mech_power_rr:
      expression: electricsystem_em4_speed * electricsystem_em4_torque * 2.0 * 3.141592653589793
        / 60000.0
    engine_power_required:
      expression: engine_speed * engine_torque * 2.0 * 3.141592653589793 / 60000.0
    generator_power_1:
      expression: engine_speed * generator_torque_1 * 2.0 * 3.141592653589793 / 60000.0
    agrochemical_discharge:
      required: false
    total_bulldozing_resistance_power:
      required: false
      for_plot: true
    tyre_bulldozing_resistance_energy_wh:
      required: false
    tyre_bulldozing_resistance_energy_accumulated:
      required: false
    total_compaction_resistance_power:
      required: false
      for_plot: true
    tyre_compaction_resistance_energy_wh:
      required: false
    tyre_compaction_resistance_energy_accumulated:
      required: false
  statistics:
    total_auxiliary_power_max:
      required: false
    auxiliary_energy_accumulated_max:
      required: false
      operation: last
      notes: Final signed accumulated energy; metric ID retained for presentation
        compatibility.
    wheel_power_total_max:
      required: false
    tyre_total_energy_accumulated_last:
      required: false
    agrochemical_discharge_max:
      required: false
    road_height_max:
      required: false
    road_height_min:
      required: false
    steer_fl_max:
      required: false
    steer_fr_max:
      required: false
    steer_rl_max:
      required: false
    steer_rr_max:
      required: false
  kpis:
    total_energy_consumption_tyres_aux:
      required: false
    road_height_range:
      required: false
    steer_abs_max:
      required: false
channels:
  raw:
  - semantic_name: torque_map_driveshaft_rl
    source_name: DriveShaft_Torque_RL
    report_name: Torque Map Driveshaft RL
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
    for_report: false
    notes: Explicit rear driveshaft source for operating maps only; no conversion or
      substitution in existing wheel calculations.
  - semantic_name: torque_map_driveshaft_rr
    source_name: DriveShaft_Torque_RR
    report_name: Torque Map Driveshaft RR
    channel_type: VSM
    unit: Nm
    required: false
    for_plot: true
    for_report: false
    notes: Explicit rear driveshaft source for operating maps only; no conversion or
      substitution in existing wheel calculations.
  - semantic_name: auxiliary_high_voltage_power_consumption
    source_name: User_defined_Data_High_Voltage_Auxiliary_signal1_0
    report_name: Auxiliary High Voltage Power Consumption
    channel_type: AVL
    unit: kW
    unit_interpretation:
      source_unit: '-'
      engineering_unit: kW
      authority: 'Sergio, Astauto, 16 October 2026: confirmed power in kW; VSM User Defined Channel cannot export its unit. Factor 1, offset 0.'
    required: false
    for_plot: true
    notes: Measured high-voltage auxiliary power; never replaced with a constant or
      unrelated source.
plots:
# Append separate time-based quantities; retain the existing combined charts.
- plot_id: total_bulldozing_resistance_power
  title: Total Bulldozing Resistance Power
  x: track_time
  x_label: Time [s]
  primary_y_label: Power [kW]
  order: 100
  series:
  - semantic_name: total_bulldozing_resistance_power
    label: Total Bulldozing Resistance Power
- plot_id: tyre_bulldozing_resistance_energy_accumulated
  title: Tyre Bulldozing Resistance Energy Accumulated
  x: track_time
  x_label: Time [s]
  primary_y_label: Energy [kWh]
  order: 101
  series:
  - semantic_name: tyre_bulldozing_resistance_energy_accumulated
    label: Tyre Bulldozing Resistance Energy Accumulated
- plot_id: total_compaction_resistance_power
  title: Total Compaction Resistance Power
  x: track_time
  x_label: Time [s]
  primary_y_label: Power [kW]
  order: 102
  series:
  - semantic_name: total_compaction_resistance_power
    label: Total Compaction Resistance Power
- plot_id: tyre_compaction_resistance_energy_accumulated
  title: Tyre Compaction Resistance Energy Accumulated
  x: track_time
  x_label: Time [s]
  primary_y_label: Energy [kWh]
  order: 103
  series:
  - semantic_name: tyre_compaction_resistance_energy_accumulated
    label: Tyre Compaction Resistance Energy Accumulated
- plot_id: tyre_soil_bulldozing
  title: Tyre-Soil Bulldozing
  x: distance_km
  x_label: Distance [km]
  primary_y_label: Power [kW]
  secondary_y_label: Energy [kWh]
  order: 19
  reference_chart_number: 19
  series:
  - semantic_name: total_bulldozing_resistance_power
    label: Total Bulldozing Resistance Power
  - semantic_name: tyre_bulldozing_resistance_energy_accumulated
    axis: secondary
    label: Bulldozing Energy Accumulated
- plot_id: tyre_soil_compaction
  title: Tyre-Soil Compaction
  x: distance_km
  x_label: Distance [km]
  primary_y_label: Power [kW]
  secondary_y_label: Energy [kWh]
  order: 20
  reference_chart_number: 20
  series:
  - semantic_name: total_compaction_resistance_power
    label: Total Compaction Resistance Power
  - semantic_name: tyre_compaction_resistance_energy_accumulated
    axis: secondary
    label: Compaction Energy Accumulated
- plot_id: wheel_torque
  title: Wheel Torque
  x: distance_km
  x_label: Distance [km]
  primary_y_label: Torque [Nm]
  order: 24
  series:
  - semantic_name: driveshaft_torque_fl
    label: Wheel Torque FL
    required: false
  - semantic_name: driveshaft_torque_fr
    label: Wheel Torque FR
    required: false
  - semantic_name: driveshaft_torque_rl
    label: Wheel Torque RL
    required: false
  - semantic_name: driveshaft_torque_rr
    label: Wheel Torque RR
    required: false
  - semantic_name: wheel_total_torque
    label: Wheel Total Torque
    required: false
- plot_id: wheel_power
  title: Wheel Power
  x: distance_km
  x_label: Distance [km]
  primary_y_label: Power [kW]
  order: 25
  series:
  - semantic_name: wheel_power_fl
    label: Wheel Power FL
    required: false
  - semantic_name: wheel_power_fr
    label: Wheel Power FR
    required: false
  - semantic_name: wheel_power_rl
    label: Wheel Power RL
    required: false
  - semantic_name: wheel_power_rr
    label: Wheel Power RR
    required: false
  - semantic_name: wheel_power_total
    label: Wheel Power Total
    required: false
- plot_id: torque_map_powertrain
  title: Electric Motor Torque vs Motor Speed
  x: electricsystem_em1_speed
  x_label: Motor Speed [rpm]
  primary_y_label: Torque [Nm]
  render_mode: scatter
  report_group: torque_maps
  order: 200
  notes: Actual signed operating points; no capability envelope or inferred conversion.
  series:
  - semantic_name: electricsystem_em1_torque
    x: electricsystem_em1_speed
    component: EM1
    label: EM1 / FL
    measurement_location: electric motor shaft
    required: false
  - semantic_name: electricsystem_em2_torque
    x: electricsystem_em2_speed
    component: EM2
    label: EM2 / FR
    measurement_location: electric motor shaft
    required: false
  - semantic_name: electricsystem_em3_torque
    x: electricsystem_em3_speed
    component: EM3
    label: EM3 / RL
    measurement_location: electric motor shaft
    required: false
  - semantic_name: electricsystem_em4_torque
    x: electricsystem_em4_speed
    component: EM4
    label: EM4 / RR
    measurement_location: electric motor shaft
    required: false
- plot_id: torque_map_wheels
  title: Wheel-Side Torque vs Wheel Speed
  x: wheel_rotationalspeed_fl
  x_label: Wheel Speed [rpm]
  primary_y_label: Measured Torque [Nm]
  render_mode: scatter
  report_group: torque_maps
  order: 201
  notes: Individual measured locations labelled in legend; no drivetrain conversion.
  series:
  - semantic_name: driveshaft_torque_fl
    x: wheel_rotationalspeed_fl
    component: FL
    label: FL gearbox output
    measurement_location: motor gearbox output
    required: false
  - semantic_name: driveshaft_torque_fr
    x: wheel_rotationalspeed_fr
    component: FR
    label: FR gearbox output
    measurement_location: motor gearbox output
    required: false
  - semantic_name: driveshaft_torque_rl
    x: wheel_rotationalspeed_rl
    component: RL
    label: RL gearbox output
    measurement_location: motor gearbox output
    required: false
  - semantic_name: driveshaft_torque_rr
    x: wheel_rotationalspeed_rr
    component: RR
    label: RR gearbox output
    measurement_location: motor gearbox output
    required: false
  - semantic_name: torque_map_driveshaft_rl
    x: wheel_rotationalspeed_rl
    component: RL driveshaft
    label: RL driveshaft
    measurement_location: rear driveshaft; not asserted equivalent to gearbox output
      or tyre-contact torque
    required: false
  - semantic_name: torque_map_driveshaft_rr
    x: wheel_rotationalspeed_rr
    component: RR driveshaft
    label: RR driveshaft
    measurement_location: rear driveshaft; not asserted equivalent to gearbox output
      or tyre-contact torque
    required: false
