kpis:
  - kpi_id: time_hours
    expression: time_minutes_last / 60
    dependencies:
    - time_minutes_last
    display_name: Time
    unit: hrs
    placement_group: summary
  - kpi_id: used_energy_edu_i
    expression: energy_released_last - energy_recuperated_last
    dependencies:
    - energy_released_last
    - energy_recuperated_last
    display_name: Used Energy (EDU+I)
    unit: kWh
    placement_group: summary
  - kpi_id: total_energy_consumption_tyres_aux
    expression: tyre_rr_energy_accumulated_last + auxiliary_energy_accumulated_last
    dependencies:
    - tyre_rr_energy_accumulated_last
    - auxiliary_energy_accumulated_last
    display_name: Total Energy Consumption (Tyres + Aux)
    unit: kWh
    placement_group: summary
  - kpi_id: battery_capacity_used
    expression: battery_energy_first - battery_energy_last
    dependencies:
    - battery_energy_first
    - battery_energy_last
    display_name: Battery Capacity Used
    unit: kWh
    placement_group: summary
  - kpi_id: battery_energy_consumption_wh_per_km
    expression: 1000 * battery_capacity_used / distance_km_last
    dependencies:
    - battery_capacity_used
    - distance_km_last
    display_name: Battery Energy Consumption
    unit: Wh/Km
    placement_group: summary
  - kpi_id: battery_capacity_100
    expression: nominal_battery_capacity_kwh(electricsystem_battery_energy, electricsystem_battery_soc)
    dependencies:
    - electricsystem_battery_energy
    - electricsystem_battery_soc
    display_name: 100% Battery Capacity
    unit: kWh
    placement_group: summary
    notes: Nominal battery capacity at 100% SOC is inferred from Battery Energy / (SOC / 100) across valid samples; initial SOC is not assumed to be 95% or a maximum SOC limit.
  - kpi_id: usable_battery_capacity_85
    expression: battery_capacity_100 * 0.85
    dependencies:
    - battery_capacity_100
    display_name: 85% Battery Capacity
    unit: kWh
    placement_group: summary
    notes: Usable energy for Range @ 85% is 0.85 times inferred nominal battery capacity, independent of the simulation starting SOC.
  - kpi_id: range_85_battery_km
    expression: 1000 * usable_battery_capacity_85 / battery_energy_consumption_wh_per_km
    dependencies:
    - usable_battery_capacity_85
    - battery_energy_consumption_wh_per_km
    display_name: Range for 85% Battery + Range Extender
    unit: Km
    placement_group: summary
  - kpi_id: max_battery_discharge_power
    expression: -1 * battery_power_min
    dependencies:
    - battery_power_min
    display_name: Max Battery Power
    unit: kW
    placement_group: summary
