  powerpoint_template: reference_files/RoboSprayer_Electric_Report_FINAL.pptx
  metadata_pills:
    - GVW 3,500 kg
    - Electric powertrain
    - 12 kph field
    - Battery 50 kW
    - Motor 63 rpm
  slides:
    - slide_id: cover
      statistics:
        - distance_km_last
        - time_minutes_last
        - battery_soc_last
        - battery_energy_consumption_wh_per_km
        - range_85_battery_km
        - max_battery_discharge_power
