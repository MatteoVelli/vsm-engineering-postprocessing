  math:
  - semantic_name: time_minutes
    source_name: Time
    report_name: Time (min)
    unit: min
    required: true
    for_plot: true
    dependencies:
    - track_time
    formula: =A5/60
    expression: track_time / 60
  - semantic_name: distance_km
    source_name: Distance
    report_name: Distance (Km)
    unit: Km
    required: true
    for_plot: true
    dependencies:
    - track_distance
    formula: =F5/1000
    expression: track_distance / 1000
  - semantic_name: total_edu_elect_power
    source_name: Total EDU Elect Power
    report_name: Total EDU Elect Power
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_battery_em1_power
    - electricsystem_battery_em2_power
    - electricsystem_battery_em4_power
    - electricsystem_battery_em3_power
    formula: =X5+Y5+AA5+Z5
    expression: electricsystem_battery_em1_power + electricsystem_battery_em2_power + electricsystem_battery_em4_power + electricsystem_battery_em3_power
  - semantic_name: battery_power_squared
    source_name: Battery Power RMS
    report_name: Battery Power RMS
    unit: kW^2
    required: true
    for_plot: true
    dependencies:
    - electricsystem_battery_power
    formula: =AC5^2
    expression: electricsystem_battery_power ** 2
  - semantic_name: battery_heatflow_squared
    source_name: Battery Heatflow RMS
    report_name: Battery Heatflow RMS
    unit: kW^2
    required: true
    for_plot: true
    dependencies:
    - electricsystem_battery_heatflow
    formula: =AE5^2
    expression: electricsystem_battery_heatflow ** 2
  - semantic_name: edu_mech_power_fl
    source_name: EDU Mech Power FL
    report_name: EDU Mech Power FL
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_em1_speed
    - electricsystem_em1_torque
    formula: =BA5*BE5/9548.8
    expression: electricsystem_em1_speed * electricsystem_em1_torque / rpm_nm_to_kw_divisor
  - semantic_name: edu_mech_power_fr
    source_name: EDU Mech Power FR
    report_name: EDU Mech Power FR
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_em2_speed
    - electricsystem_em2_torque
    formula: =BB5*BF5/9548.8
    expression: electricsystem_em2_speed * electricsystem_em2_torque / rpm_nm_to_kw_divisor
  - semantic_name: edu_mech_power_rl
    source_name: EDU Mech Power RL
    report_name: EDU Mech Power RL
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_em3_speed
    - electricsystem_em3_torque
    formula: =BC5*BG5/9548.8
    expression: electricsystem_em3_speed * electricsystem_em3_torque / rpm_nm_to_kw_divisor
  - semantic_name: edu_mech_power_rr
    source_name: EDU Mech Power RR
    report_name: EDU Mech Power RR
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_em4_speed
    - electricsystem_em4_torque
    formula: =BD5*BH5/9548.8
    expression: electricsystem_em4_speed * electricsystem_em4_torque / rpm_nm_to_kw_divisor
  - semantic_name: total_edu_mech_power
    source_name: Total EDU Mech Power
    report_name: Total EDU Mech Power
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - edu_mech_power_fl
    - edu_mech_power_fr
    - edu_mech_power_rr
    - edu_mech_power_rl
    formula: =BI5+BJ5+BL5+BK5
    expression: edu_mech_power_fl + edu_mech_power_fr + edu_mech_power_rr + edu_mech_power_rl
  - semantic_name: agrochemical_discharge
    source_name: Agrochemical Discharge
    report_name: Agrochemical Discharge
    unit: Kg
    required: false
    for_plot: true
    dependencies:
    - agrochemical_discharge_force
    formula: =-1*BU5/9.81
    expression: -1 * agrochemical_discharge_force / 9.81
    notes: Converts the proven HitchRear_Force_Z_VehicleCoordinates force channel to reported agrochemical mass.
  - semantic_name: total_rolling_resistance_power
    source_name: ' Total Rolling Resistance Power'
    report_name: ' Total Rolling Resistance Power'
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - tyre_rollingresistancepower_fl
    - tyre_rollingresistancepower_fr
    - tyre_rollingresistancepower_rl
    - tyre_rollingresistancepower_rr
    formula: =EZ5+FA5+FB5+FC5
    expression: tyre_rollingresistancepower_fl + tyre_rollingresistancepower_fr + tyre_rollingresistancepower_rl + tyre_rollingresistancepower_rr
  - semantic_name: tyre_rolling_resistance_energy_kwh
    source_name: ' Tyre Rolling Resistance Energy'
    report_name: ' Tyre Rolling Resistance Energy'
    unit: kWh
    required: true
    for_plot: true
    dependencies:
    - total_rolling_resistance_power
    - track_time
    formula: =(FD5)*1/3600
    expression: sample_energy_kwh(total_rolling_resistance_power, track_time)
  - semantic_name: tyre_rolling_resistance_energy_wh
    source_name: ' Tyre Rolling Resistance Energy'
    report_name: ' Tyre Rolling Resistance Energy'
    unit: Wh
    required: true
    for_plot: true
    dependencies:
    - tyre_rolling_resistance_energy_kwh
    formula: =FE5*1000
    expression: tyre_rolling_resistance_energy_kwh * 1000
  - semantic_name: tyre_rolling_resistance_energy_accumulated
    source_name: ' Tyre Rolling Resistance Energy Accomulated'
    report_name: ' Tyre Rolling Resistance Energy Accomulated'
    unit: kWh
    required: true
    for_plot: true
    dependencies:
    - tyre_rolling_resistance_energy_kwh
    formula: =SUM(FE5:FE$6)
    expression: cumulative_sum(tyre_rolling_resistance_energy_kwh)
  - semantic_name: driveshaft_torque_fl
    source_name: DriveShaft_Torque_FL
    report_name: Wheel Torque FL
    unit: Nm
    required: true
    for_plot: true
    fallback_when_raw_missing: true
    formula: '0'
    expression: '0'
  - semantic_name: driveshaft_torque_fr
    source_name: DriveShaft_Torque_FR
    report_name: Wheel Torque FR
    unit: Nm
    required: true
    for_plot: true
    fallback_when_raw_missing: true
    formula: '0'
    expression: '0'
  - semantic_name: driveshaft_torque_rl
    source_name: DriveShaft_Torque_RL
    report_name: Wheel Torque RL
    unit: Nm
    required: true
    for_plot: true
    fallback_when_raw_missing: true
    formula: '0'
    expression: '0'
  - semantic_name: driveshaft_torque_rr
    source_name: DriveShaft_Torque_RR
    report_name: Wheel Torque RR
    unit: Nm
    required: true
    for_plot: true
    fallback_when_raw_missing: true
    formula: '0'
    expression: '0'
  - semantic_name: wheel_total_torque
    source_name: Wheel Total Torque
    report_name: Wheel Total Torque
    unit: Nm
    required: true
    for_plot: true
    dependencies:
    - driveshaft_torque_rl
    - driveshaft_torque_rr
    formula: =GN5+GO5
    expression: driveshaft_torque_rl + driveshaft_torque_rr
  - semantic_name: wheel_power_fl
    source_name: Wheel Power FL
    report_name: Wheel Power FL
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - wheel_rotationalspeed_fl
    - driveshaft_torque_fl
    formula: =GH5*GL5/9548.8
    expression: wheel_rotationalspeed_fl * driveshaft_torque_fl / rpm_nm_to_kw_divisor
  - semantic_name: wheel_power_fr
    source_name: Wheel Power FR
    report_name: Wheel Power FR
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - wheel_rotationalspeed_fr
    - driveshaft_torque_fr
    formula: =GI5*GM5/9548.8
    expression: wheel_rotationalspeed_fr * driveshaft_torque_fr / rpm_nm_to_kw_divisor
  - semantic_name: wheel_power_rl
    source_name: Wheel Power RL
    report_name: Wheel Power RL
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - wheel_rotationalspeed_rl
    - driveshaft_torque_rl
    formula: =GJ5*GN5/9548.8
    expression: wheel_rotationalspeed_rl * driveshaft_torque_rl / rpm_nm_to_kw_divisor
  - semantic_name: wheel_power_rr
    source_name: Wheel Power RR
    report_name: Wheel Power RR
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - wheel_rotationalspeed_rr
    - driveshaft_torque_rr
    formula: =GK5*GO5/9548.8
    expression: wheel_rotationalspeed_rr * driveshaft_torque_rr / rpm_nm_to_kw_divisor
  - semantic_name: wheel_power_total
    source_name: Wheel Power Total
    report_name: Wheel Power Total
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - wheel_power_rl
    - wheel_power_rr
    formula: =GS5+GT5
    expression: wheel_power_rl + wheel_power_rr
  - semantic_name: auxiliary_high_voltage_power_consumption
    source_name: Auxiliary Haigh Voltage Power Consumption
    report_name: Auxiliary Haigh Voltage Power Consumption
    unit: kW
    required: true
    for_plot: true
    formula: '0'
    expression: '0'
  - semantic_name: total_auxiliary_power
    source_name: Total Auxiliary Power
    report_name: Total Auxiliary Power
    unit: kW
    required: true
    for_plot: true
    dependencies:
    - electricsystem_auxiliary_lowvoltagepowerconsumption
    - auxiliary_high_voltage_power_consumption
    formula: =HD5+HE5
    expression: electricsystem_auxiliary_lowvoltagepowerconsumption + auxiliary_high_voltage_power_consumption
  - semantic_name: auxiliary_energy_consumption
    source_name: Auxiliary Energy Consumption
    report_name: Auxiliary Energy Consumption
    unit: kWh
    required: true
    for_plot: true
    dependencies:
    - total_auxiliary_power
    - track_time
    formula: =(HF5)*1/3600
    expression: sample_energy_kwh(total_auxiliary_power, track_time)
  - semantic_name: auxiliary_energy_consumption_accumulated
    source_name: Auxiliary Energy Consumption Accumulated
    report_name: Auxiliary Energy Consumption Accumulated
    unit: kWh
    required: true
    for_plot: true
    dependencies:
    - auxiliary_energy_consumption
    formula: =HG5
    expression: cumulative_sum(auxiliary_energy_consumption)
