version: 1

presentation:
  title: Hybrid SP Caiman Sprayer - Feasibility Study
  subtitle: Deterministic full duty-cycle engineering report
  output_filename: vsm_engineering_report.pptx
  footer: VSM Engineering Post-Processing Tool
  author: VSM Engineering
  subject: Hybrid SP Caiman deterministic duty-cycle feasibility study
  keywords: VSM, hybrid sprayer, duty cycle, engineering report, Sergio reference
  comments: Canonical deterministic results generated from the configured full duty-cycle pipeline.

theme:
  title_font_size: 25
  subtitle_font_size: 12
  kpi_label_font_size: 8.8
  kpi_value_font_size: 17
  body_font_size: 10.5
  accent_fill: F7F3E8
  accent_border: 9C7A2F
  text_color: 1E252B
  muted_text_color: 5D6770
  background_color: FFFFFF
  rule_color: B8C2CC

slides:
  - slide_id: cover
    type: cover
    title: Hybrid SP Caiman Sprayer - Feasibility Study
    subtitle: 17,418-sample reconstructed Sergio duty cycle
    statistics:
      - report_time_last
      - report_distance_last
      - report_battery_soc_last
      - report_fuel_last
      - report_total_generator_power_max
      - report_engine_power_max
    body:
      - GVW 13,300 kg and ambient condition 25 degC from Sergio reference context
      - "Mission: 222 ha work, road transfer, 222 ha work"
      - "Scenario: 30 kph field target, 60 kph road target"
      - "Architecture context: 1C + 2G battery/generator configuration"

  - slide_id: mission_overview
    type: overview
    title: System and Mission Overview
    subtitle: Field work, road transfer and loading/opportunity-charging structure
    statistics:
      - report_time_last
      - report_distance_last
      - report_speed_max
      - report_total_generator_power_max
    body:
      - Six 74 ha field-work cycles form approximately 444 ha of work.
      - Five 900 s loading phases are represented in the full mission.
      - One road-transfer section connects the two major field-work blocks.
      - The configured full mission contains 12 deterministic phases.
      - Source numerical values remain the canonical pipeline outputs.
      - Battery state of charge is tracked across field, road and loading phases.
      - Generator operation follows the reconstructed deterministic reference scenario.
      - Excel remains the native interactive chart workbook; PowerPoint uses Matplotlib PNG figures.

  - slide_id: executive_results
    type: kpi_grid
    title: Duty-Cycle Executive Results
    subtitle: Canonical deterministic KPIs
    statistics:
      - report_time_last
      - report_distance_last
      - report_speed_max
      - report_battery_initial_soc
      - report_battery_soc_last
      - report_battery_capacity_used
      - report_battery_discharge_power_max
      - report_battery_heatflow_rms
      - report_battery_heatflow_max
      - report_fuel_last
      - report_total_generator_power_max
      - report_engine_energy_sum
    body:
      - Values are formatted for presentation; calculations remain owned by the validated statistics engine.

  - slide_id: vehicle_operation
    type: plot_full
    title: Duty-Cycle Vehicle Operation
    subtitle: Speed trace over the full 114 km mission with phase boundaries
    statistics:
      - report_distance_last
      - report_time_last
      - report_speed_max
      - report_battery_soc_last
    plots:
      - report_speed_vs_distance

  - slide_id: battery_energy_system
    type: plot_pair
    title: Battery and Electrical Energy System
    subtitle: Battery state of charge, energy and power behavior
    statistics:
      - report_battery_initial_soc
      - report_battery_soc_last
      - report_battery_discharge_power_max
      - report_battery_heatflow_rms
      - report_battery_heatflow_max
    plots:
      - report_battery_soc
      - report_battery_energy_time_based

  - slide_id: battery_power_recovery
    type: plot_pair
    title: Battery Power and Energy Recovery
    subtitle: Charge/discharge behavior and released/recuperated energy
    statistics:
      - report_battery_power_rms
      - report_energy_released_last
      - report_energy_recuperated_last
      - report_auxiliary_energy_sum
    plots:
      - report_battery_power_charge_discharge
      - report_energy_released

  - slide_id: range_extender_generator
    type: plot_pair
    title: Range Extender and Generator
    subtitle: Generator operation, fuel consumption and engine demand
    statistics:
      - report_total_generator_power_max
      - report_engine_power_max
      - report_engine_speed_max
      - report_engine_torque_max
      - report_fuel_last
      - report_engine_energy_sum
    plots:
      - report_generator_power
      - report_engine_power_and_fuel_vs_time

  - slide_id: opportunity_charging
    type: plot_pair
    title: Opportunity Charging During Loading
    subtitle: Five 900 s loading phases represented in the mission reconstruction
    statistics:
      - report_battery_initial_soc
      - report_battery_soc_last
      - report_battery_power_max
      - report_total_generator_power_max
      - report_agrochemical_discharge_max
    plots:
      - report_battery_soc
      - report_agrochemical_discharge_and_charge_vs_time
    body:
      - Charging behavior is shown as a deterministic result, not as a viability claim.

  - slide_id: traction_auxiliaries
    type: plot_pair
    title: Traction, EDU and Auxiliary Energy Demand
    subtitle: Wheel/EDU demand and auxiliary/tyre energy contributors
    statistics:
      - report_total_edu_mech_power_max
      - report_wheel_power_total_max
      - report_edu_speed_rl_max
      - report_edu_torque_rl_max
      - report_tyre_energy_accumulated_last
      - report_auxiliary_energy_last
    plots:
      - report_power_at_wheels_and_edu
      - report_tyres_energy_consumption

  - slide_id: simulation_summary
    type: conclusion
    title: Simulation Summary
    subtitle: Deterministic full-mission result snapshot
    statistics:
      - report_distance_last
      - report_time_last
      - report_battery_soc_last
      - report_fuel_last
      - report_total_generator_power_max
      - report_engine_energy_sum
    body:
      - The full 17,418-sample reconstructed mission completed with 114.00 km distance.
      - Canonical final battery SOC is 23.94 percent and canonical fuel consumption is 39.84 kg.
      - Maximum total generator power is 80.03 kW in the deterministic mission result.
      - Native Excel charts remain available separately for interactive workbook review.
      - Final commercial or safety conclusions require explicit engineering acceptance criteria.
