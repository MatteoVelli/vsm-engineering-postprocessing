version: 1

presentation:
  title: Hybrid SP Caiman – Engineering Summary
  subtitle: Deterministic VSM post-processing report
  output_filename: vsm_engineering_report.pptx
  footer: Generated by the VSM Engineering Post-Processing Tool

theme:
  title_font_size: 28
  subtitle_font_size: 14
  kpi_label_font_size: 10
  kpi_value_font_size: 19
  body_font_size: 11
  accent_fill: FFF2CC
  accent_border: D6B656
  text_color: 111111
  muted_text_color: 666666

# The useful pattern in Sergio's reference deck is retained: a KPI strip at
# the top of duty-cycle slides and one/two engineering plots underneath.
slides:
  - slide_id: engineering_summary
    type: summary
    title: Hybrid SP Caiman – Engineering Summary
    subtitle: Source simulation overview
    statistics:
      - report_time_last
      - report_distance_last
      - report_speed_max
      - report_battery_soc_last
      - report_auxiliary_energy_sum
      - report_total_generator_power_max
    plots: []

  - slide_id: duty_cycle_motion
    type: plot_pair
    title: Caiman SP Hybrid – Duty Cycle
    subtitle: Vehicle speed, distance and battery state of charge
    statistics:
      - report_time_last
      - report_distance_last
      - report_speed_max
      - report_battery_soc_last
    plots:
      - speed_vs_time
      - battery_soc_vs_distance

  - slide_id: energy_system
    type: plot_pair
    title: Caiman SP Hybrid – Electrical Energy System
    subtitle: Battery, generator and auxiliary demand
    statistics:
      - report_battery_power_rms
      - report_battery_power_max
      - report_battery_power_min
      - report_auxiliary_energy_sum
      - report_total_generator_power_max
    plots:
      - battery_and_generator_power_vs_time
      - auxiliaries_energy_consumption

  - slide_id: powertrain
    type: plot_pair
    title: Caiman SP Hybrid – Powertrain Demand
    subtitle: Wheel, EDU and engine operating demand
    statistics:
      - report_total_edu_power_max
      - report_wheel_power_rl_max
      - report_engine_power_max
      - report_engine_speed_max
      - report_fuel_last
    plots:
      - power_at_wheels_and_edu
      - engine_power_and_fuel_vs_distance
