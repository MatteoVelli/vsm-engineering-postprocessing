version: 1

# Acceptance configuration for the supplied Electrification_03 report.
# The run script limits the imported data area to A5:BR17422 so the existing
# summary rows and KPI block are not treated as simulation samples.
statistics:
  - statistic_id: report_battery_power_rms
    channel_id: battery_power__col_013
    operation: rms
    placement_group: top_rms
    display_name: Battery Power RMS
    description: The report divides by elapsed seconds (17417), whereas this engine uses the explicit sample-mean RMS definition. The tolerance documents the small known difference.
    compare_to:
      cell: N2
      absolute_tolerance: 0.002
      relative_tolerance: 5.0e-5

  - statistic_id: report_battery_heatflow_rms
    channel_id: battery_heatflow__col_015
    operation: rms
    placement_group: top_rms
    display_name: Battery Heatflow RMS
    description: Sample-mean RMS compared with the legacy duration-denominator workbook result.
    compare_to:
      cell: P2
      absolute_tolerance: 0.0002
      relative_tolerance: 5.0e-5

  - statistic_id: report_time_last
    channel_id: time__col_002
    operation: last
    placement_group: bottom_channel
    compare_to: {cell: B17423, absolute_tolerance: 1.0e-12, relative_tolerance: 1.0e-12}

  - statistic_id: report_longitudinal_acceleration_max
    channel_id: longitudinal_acceleration__col_003
    operation: max
    placement_group: bottom_channel
    compare_to: {cell: C17423, absolute_tolerance: 1.0e-12, relative_tolerance: 1.0e-12}

  - statistic_id: report_vertical_acceleration_max
    channel_id: vertical_acceleration__col_004
