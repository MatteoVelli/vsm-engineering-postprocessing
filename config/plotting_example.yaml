      - channel_id: auxiliary_energy_consumption_accumulated__col_065
        axis: secondary
        label: Auxiliary Energy Consumption Accumulated

  - plot_id: report_speed_vs_distance
    reference_chart_number: 3
    title: Vehicle Speed vs Distance
    x_channel_id: distance__col_007
    x_label: Distance [km]
