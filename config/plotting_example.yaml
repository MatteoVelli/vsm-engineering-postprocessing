version: 1

defaults:
  width_inches: 11.5
  height_inches: 6.2
  dpi: 180
  grid: true
  legend: true
  line_width: 1.35

style:
  title_fontsize: 15
  axis_label_fontsize: 11
  tick_fontsize: 9
  legend_fontsize: 9
  legend_location: best
  legend_columns: 1
  grid_alpha: 0.28
  grid_linewidth: 0.6
  primary_line_style: "-"
  secondary_line_style: "--"
  background: white
  transparent: false
  constrained_layout: false
  tight_layout: true
  zero_line: true
  output_formats: [png, svg]

plots:
  - plot_id: speed_vs_time
    title: Vehicle Speed vs Time
    x_channel_id: calc_time_minutes
    x_label: Time [min]
    primary_y_label: Speed [kph]
    output_filename: speed_vs_time.png
    series:
      - channel_id: chassis_speed__col_005
        axis: primary
        label: Speed

  - plot_id: battery_soc_vs_distance
    title: Battery State of Charge vs Distance
    x_channel_id: calc_distance_km
    x_label: Distance [km]
    primary_y_label: Speed [kph]
    secondary_y_label: Battery SOC [%]
    output_filename: battery_soc_vs_distance.png
    series:
      - channel_id: chassis_speed__col_005
        axis: primary
        label: Speed
      - channel_id: electricsystem_battery_soc__col_018
        axis: secondary
        label: Battery SOC

  - plot_id: battery_and_generator_power_vs_time
    title: Battery Power Charge and Discharge
    x_channel_id: calc_time_minutes
    x_label: Time [min]
    primary_y_label: Power [kW]
    output_filename: battery_and_generator_power_vs_time.png
    series:
      - channel_id: electricsystem_battery_power__col_013
        axis: primary
        label: Battery Power
      - channel_id: calc_total_generator_power
        axis: primary
        label: Total Generator Power

  - plot_id: engine_power_and_fuel_vs_distance
    title: Engine Power and Fuel Consumption vs Distance
    x_channel_id: calc_distance_km
    x_label: Distance [km]
    primary_y_label: Engine Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: engine_power_and_fuel_vs_distance.png
    series:
      - channel_id: calc_engine_power_required
        axis: primary
        label: Engine Power Required
      - channel_id: engine_fuelconsumption_absolut__col_030
        axis: secondary
        label: Engine Fuel Consumption

  - plot_id: auxiliaries_energy_consumption
    title: Auxiliaries Energy Consumption
    x_channel_id: calc_time_minutes
    x_label: Time [min]
    primary_y_label: Auxiliary Power [kW]
    secondary_y_label: Accumulated Energy [kWh]
    output_filename: auxiliaries_energy_consumption.png
    series:
      - channel_id: calc_total_auxiliary_power
        axis: primary
        label: Total Auxiliary Power
      - channel_id: calc_auxiliary_energy_accumulated
        axis: secondary
        label: Auxiliary Energy Accumulated

  - plot_id: power_at_wheels_and_edu
    title: Wheel and EDU Power
    x_channel_id: calc_distance_km
    x_label: Distance [km]
    primary_y_label: Power [kW]
    output_filename: power_at_wheels_and_edu.png
    series:
      - channel_id: wheel_power_rl__col_058
        axis: primary
        label: Wheel Power RL
      - channel_id: edu_mech_power_rl__col_024
        axis: primary
        label: EDU Mech Power RL

  - plot_id: report_fuel_consumption
    reference_chart_number: 1
    title: Fuel Consumption
    x_channel_id: time__col_002
    x_label: Time [min]
    primary_y_label: Fuel Consumption [kg]
    secondary_y_label: Fuel Flow [l/h]
    output_filename: report_01_fuel_consumption.png
    series:
      - channel_id: engine_fuelconsumption_absolut__col_030
        axis: primary
        label: Engine Fuel Consumption
      - channel_id: engine_fuelconsumption_volumeflow__col_032
        axis: secondary
        label: Fuel Flow

  - plot_id: report_auxiliaries_energy_consumption
    reference_chart_number: 2
    title: Auxiliaries Energy Consumption
    x_channel_id: time__col_002
    x_label: Time [min]
    primary_y_label: Total Auxiliary Power [kW]
    secondary_y_label: Auxiliary Energy [kWh]
    output_filename: report_02_auxiliaries_energy_consumption.png
    series:
