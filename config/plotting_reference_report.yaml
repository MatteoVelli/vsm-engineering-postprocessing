  - plot_id: report_engine_power_and_fuel_vs_distance
    reference_chart_number: 17
    title: Engine Power Required & Fuel Consumption Vs Distance
    x_channel_id: distance__col_007
    x_label: Distance [km]
    primary_y_label: Engine Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 17_engine_power_and_fuel_vs_distance.png
    series:
      - channel_id: engine_fuel_consumption__col_030
        axis: secondary
        label: Engine Fuel Consumption
      - channel_id: engine_power_required__col_035
        axis: primary
        label: Engine Power Required

  - plot_id: report_battery_energy_and_fuel_vs_distance
    reference_chart_number: 18
    title: Battery Energy & Fuel Consumption Vs Distance
    x_channel_id: distance__col_007
    x_label: Distance [km]
    primary_y_label: Battery Energy [kWh]
