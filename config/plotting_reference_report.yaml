    series:
      - channel_id: battery_energy__col_017
        axis: primary
        label: Battery Energy
      - channel_id: engine_fuel_consumption__col_030
        axis: secondary
        label: Engine Fuel Consumption

  - plot_id: report_engine_power_and_fuel_vs_time
    reference_chart_number: 19
    title: Engine Power Required & Fuel Consumption Vs Time
    x_channel_id: time__col_002
    x_label: Time [min]
    primary_y_label: Engine Power [kW]
    secondary_y_label: Fuel Consumption [kg]
    output_filename: 19_engine_power_and_fuel_vs_time.png
    series:
      - channel_id: engine_fuel_consumption__col_030
        axis: secondary
        label: Engine Fuel Consumption
      - channel_id: engine_power_required__col_035
        axis: primary
        label: Engine Power Required

  - plot_id: report_agrochemical_discharge_and_charge_vs_time
    reference_chart_number: 20
    title: Agrochemical Discharge & Charge Vs Time
    x_channel_id: time__col_002
    x_label: Time [min]
    primary_y_label: Agrochemical Discharge [N]
