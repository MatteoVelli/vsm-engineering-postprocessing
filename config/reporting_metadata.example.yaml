# Load as an ordinary reporting profile, or use the Streamlit reporting settings.
# Paths are relative to this file. Numeric defaults remain unset.
version: 1
profile:
  profile_id: battery_agro_example
  name: Electric with explicit reporting metadata
  powertrain: electric
  extends: report_profiles/robosprayer_electric.yaml
  reporting_inputs:
    machine_configuration_id: null
    battery_mass_kg: null
    battery_mass_status: not_provided
    battery_mass_provenance: null
    agro_density_kg_per_L: null
    density_provenance: null
    hitch_force_is_remaining_agro_mass: false
    agro_volume_source: null
    agro_volume_provenance: null
    agro_flow_source: null
    agro_flow_provenance: null
# Enter battery_mass_kg explicitly for each report; machine identity never supplies it.
# Manual overrides containing only battery_mass_kg receive status user_provided and
# provenance Manual report input. Explicit confirmed/estimated status is retained
# only when deliberately supplied with provenance. Diesel needs no battery input.
# Net agro discharge in kg/km reuses the profile mass calculation and final distance;
# it does not require density. Density is only for the legacy volumetric diagnostic.
# Advanced overrides may explicitly select a compatible machine_configuration_id.
# Never enter density 1 kg/L unless that value is explicitly justified.
